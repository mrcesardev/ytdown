# /etc/nginx/sites-available/ytdown
# Crie link simbólico em /etc/nginx/sites-enabled/ytdown

server {
    listen 80;
    server_name api.seudominio.com; # Substitua pelo seu domínio ou IP da VPS

    # Redirecionamento automático para HTTPS (gerado pelo certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # Cabeçalhos de Proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Otimizações para downloads pesados e streaming
        client_max_body_size 50M;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
