services:
  redis:
    image: redis:7-alpine
    container_name: ytdown_redis
    restart: always
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ytdown_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL:-https://kbfrolcsqnfazjjakfps.supabase.co}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiZnJvbGNzcW5mYXpqamFrZnBzIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDg3Nzc0OCwiZXhwIjoyMTA2NDUzNzQ4fQ.nyCjhGuXsDPyVAomAx0kKG3-nVoOxbKeZ72_M5jrIJE}
      - BASE_URL=${BASE_URL:-http://45.178.180.152:8000}
      - API_SECRET_KEY=${API_SECRET_KEY:-ytdown_sec_7d2a1b194b53cae48270df94b45a43d0f0583a8bd8226dfe}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - DOWNLOAD_DIR=/app/downloads
    volumes:
      - ./downloads:/app/downloads
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: ytdown_worker
    restart: always
    # Concurrency=1 garante que a VPS (2vCPU / 2GB RAM) execute conversões uma por vez, evitando OOM
    command: celery -A app.celery_app.celery_app worker --concurrency=1 --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL:-https://kbfrolcsqnfazjjakfps.supabase.co}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiZnJvbGNzcW5mYXpqamFrZnBzIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDg3Nzc0OCwiZXhwIjoyMTA2NDUzNzQ4fQ.nyCjhGuXsDPyVAomAx0kKG3-nVoOxbKeZ72_M5jrIJE}
      - BASE_URL=${BASE_URL:-http://45.178.180.152:8000}
      - DOWNLOAD_DIR=/app/downloads
    volumes:
      - ./downloads:/app/downloads
    depends_on:
      redis:
        condition: service_healthy
